services:
  markdown-source-graph-mcp:
    build:
      context: .
    image: markdown-source-graph-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8811}:8811"
    environment:
      MARKDOWN_MCP_MODE: ${MARKDOWN_MCP_MODE:-single}
      MARKDOWN_MCP_ROOT_ID: workspace
      MARKDOWN_MCP_ROOT_PATH: /markdown
      MARKDOWN_MCP_PUBLIC_PATH: ${MARKDOWN_PUBLIC_PATH:-}
      MARKDOWN_MCP_HUB_PATH: /markdown
      MARKDOWN_MCP_HUB_PUBLIC_PATH: ${MARKDOWN_PUBLIC_PATH:-}
      MARKDOWN_MCP_DISCOVERY_MAX_DEPTH: ${MARKDOWN_MCP_DISCOVERY_MAX_DEPTH:-4}
      MARKDOWN_MCP_DISCOVERY_TTL_SECONDS: ${MARKDOWN_MCP_DISCOVERY_TTL_SECONDS:-15}
      MARKDOWN_MCP_STATE_DIR: /data
    volumes:
      - type: bind
        source: ${MARKDOWN_MOUNT_SOURCE:?Set MARKDOWN_MOUNT_SOURCE in .env}
        target: /markdown
        read_only: true
      - type: volume
        source: markdown_mcp_state
        target: /data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8811/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  markdown_mcp_state:
