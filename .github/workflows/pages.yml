name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - site/**
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/assets _site/site
          cp index.html _site/
          cp site/styles.css site/app.js _site/site/
          cp assets/markdown-source-graph-hero.png _site/assets/
          cp assets/dashboard-*.png _site/assets/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
